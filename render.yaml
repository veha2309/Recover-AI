services:
  - type: web
    name: recover-ai
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GOOGLE_API_KEY
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: RECOVERAI_DB
        value: /tmp/recoverai/recoverai.sqlite

